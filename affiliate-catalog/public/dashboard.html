<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dasbor Afiliasi - AfiliasiHub</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <div class="brand">
          <div class="logo">Afiliasi<span>Hub</span></div>
          <nav class="main-nav">
            <a href="/index.html">Katalog</a>
            <a class="active" href="/dashboard.html">Dasbor</a>
            <a href="/admin.html">Admin</a>
          </nav>
        </div>
        <div class="actions">
          <button id="btn-theme">🌓</button>
          <button id="btn-logout" class="button ghost">Keluar</button>
        </div>
      </div>
    </header>

    <main class="container" style="padding:20px 0 40px;">
      <h1>Dasbor Afiliasi</h1>
      <p style="color:var(--muted);">Ringkasan performa klik, konversi, dan komisi.</p>

      <section style="display:grid; grid-template-columns: repeat(12, 1fr); gap:12px; margin-top:14px;">
        <div class="card" style="grid-column: span 4;">
          <div class="body">
            <div class="meta">Total Klik</div>
            <div id="stat-clicks" class="price">0</div>
          </div>
        </div>
        <div class="card" style="grid-column: span 4;">
          <div class="body">
            <div class="meta">Total Konversi</div>
            <div id="stat-conv" class="price">0</div>
          </div>
        </div>
        <div class="card" style="grid-column: span 4;">
          <div class="body">
            <div class="meta">Komisi</div>
            <div id="stat-revenue" class="price">Rp 0</div>
          </div>
        </div>
      </section>

      <section style="display:grid; grid-template-columns: repeat(12, 1fr); gap:12px; margin-top:14px;">
        <div class="card" style="grid-column: span 6;">
          <div class="body">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <div class="title">Klik per Marketplace</div>
            </div>
            <div id="chart-clicks-market" style="height:260px; display:flex; align-items:flex-end; gap:10px;"></div>
          </div>
        </div>
        <div class="card" style="grid-column: span 6;">
          <div class="body">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <div class="title">Konversi per Marketplace</div>
            </div>
            <div id="chart-conv-market" style="height:260px; display:flex; align-items:flex-end; gap:10px;"></div>
          </div>
        </div>
      </section>

      <section class="card" style="margin-top:14px;">
        <div class="body">
          <div class="title">Top Produk</div>
          <div id="top-products" style="display:grid; grid-template-columns: repeat(2, 1fr); gap:10px; margin-top:10px;"></div>
        </div>
      </section>
    </main>

    <script src="/app.js"></script>
    <script src="/dashboard.js"></script>
  </body>
  </html>
